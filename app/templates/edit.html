{% extends "base.html" %}

{% block title %}Edit Task | DoTheTask{% endblock %}

{% block content %}

<h1>Edit Task</h1>
<p>Update the details of your task.</p>

<section>
    <form action="{{ url_for('pages.edit_task', task_id=task.id) }}" method="POST">

        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ task.title }}" maxlength="150" required>

        <label for="description">Description</label>
        <textarea id="description" name="description">{{ task.description or '' }}</textarea>

        <label for="priority">Priority</label>
        <select id="priority" name="priority">

            <option value="low" {% if task.priority=="low" %}selected{% endif %}>
                Low
            </option>

            <option value="medium" {% if task.priority=="medium" %}selected{% endif %}>
                Medium
            </option>

            <option value="high" {% if task.priority=="high" %}selected{% endif %}>
                High
            </option>

        </select>

        <label for="due_date">Due Date</label>
        <input type="date" id="due_date" name="due_date" value="{{ task.due_date or '' }}">

        <label for="category_id">Category</label>
        <select id="category_id" name="category_id">

            <option value="">No Category</option>

            {% for category in categories %}
            <option value="{{ category.id }}" {% if task.category_id==category.id %} selected {% endif %}>
                {{ category.name }}
            </option>
            {% endfor %}

        </select>

        <button type="submit">Save Changes</button>

    </form>

    <a class="back-link" href="{{ url_for('pages.index') }}">
        Cancel
    </a>

</section>

{% endblock %}
