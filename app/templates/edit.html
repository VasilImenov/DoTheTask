
{% extends "base.html" %}

{% block title %}Редактиране | TaskFlow{% endblock %}

{% block content %}

<h1>Редактиране на задача</h1>
<p>Промени информацията за избраната задача.</p>

<section>
    <form action="{{ url_for('pages.edit_task', task_id=task.id) }}"
          method="POST">

        <label for="title">Заглавие</label>
        <input type="text" id="title" name="title"
               value="{{ task.title }}"
               maxlength="150" required>

        <label for="description">Описание</label>
        <textarea id="description"
                  name="description">{{ task.description or '' }}</textarea>

        <label for="priority">Приоритет</label>
        <select id="priority" name="priority">
            <option value="low"
                {% if task.priority == "low" %}selected{% endif %}>
                Нисък
            </option>
            <option value="medium"
                {% if task.priority == "medium" %}selected{% endif %}>
                Среден
            </option>
            <option value="high"
                {% if task.priority == "high" %}selected{% endif %}>
                Висок
            </option>
        </select>

        <label for="due_date">Краен срок</label>
        <input type="date" id="due_date" name="due_date"
               value="{{ task.due_date or '' }}">

        <label for="category_id">Категория</label>
        <select id="category_id" name="category_id">
            <option value="">Без категория</option>

            {% for category in categories %}
                <option value="{{ category.id }}"
                    {% if task.category_id == category.id %}
                        selected
                    {% endif %}>
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Запази промените</button>
    </form>

    <a class="back-link" href="{{ url_for('pages.index') }}">
        Отказ
    </a>
</section>

{% endblock %}
